# Mushihimesama Futari-specific analysis corrections for the code generator (default.xex).
#
# Every entry needs its evidence (which tool or which log found it). The tools that produce candidates:
#   tools/find_gaps.py, tools/gap_fixpoint.py   code the automatic discovery left without a function
#   tools/pointer_scan.py                       code pointers stored in data (vtables, callback tables)
#   tools/runtime_gap_resolver.py               "Call to invalid or unregistered function" from a game log

# The CRT's setjmp/longjmp (root keys: they must stay outside any table). Recompiled as plain calls, a longjmp would
# restore r1/r31 from the jmp_buf and then return to its own caller with a foreign stack frame (SA2's fourth boot);
# with the addresses the generator emits host setjmp/longjmp keyed by the guest jmp_buf. Found by shape
# (2026-10-05), the only pair in all nine binaries (the game cores have none):
#   setjmp  0x8215B3E0: optional hook word at 0x821FA4AC (bnectr), then stfd f14-f31 at 0(r3), std r13-r31 at
#           152(r3), stvlx128 v64.. at 320(r3); 3 callers (sub_820B8C08, sub_820B9978, sub_820CDD68)
#   longjmp 0x8215AFA0: r7 = r3, unwinds when the buffer holds an SEH registration (+312), then lfd f14-f31 / ld
#           r13-r31 from the same offsets; 4 callers in the same code (0x820B6xxx-0x820CDxxx)
# (0x820851EC also restores f14-f31/r14-r31, but from a CONTEXT record in r4 (f14 at +408): the unwinder's.)
setjmp_address = 0x8215B3E0
longjmp_address = 0x8215AFA0

[functions]
# First validation run (rexglue codegen, 2026-10-05): a direct unconditional branch (`b`, a tail call) to each
# address below, which automatic discovery had not assigned to any function ("target not in any function"; the
# caller is listed). No sizes imposed: the Discover phase determines each boundary from the PPC code.
"0x8210B038" = { }  # from 0x8210B044
"0x820F3C20" = { }  # from 0x820FEE98

