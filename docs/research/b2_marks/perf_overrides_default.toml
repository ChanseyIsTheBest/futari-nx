# Frame pacing without spinning (app/src/native/futari_native_frame.cpp, futari_frame_wait_sleep): a native call at the
# top of each of sub_8216B148's two busy loops on the frame counter; it sleeps until the vertical-blank callback bumps
# the counter, then the loop's own compare runs.
[[midasm_hook]]
name = "FutariFrameWaitHook"
address = 0x8216B244
registers = ["r10", "r11"]

